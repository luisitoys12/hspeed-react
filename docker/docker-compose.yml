services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hspeed
      POSTGRES_PASSWORD: hspeed
      POSTGRES_DB: hspeed
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hspeed -d hspeed"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
      # Sobreescribe con tu DATABASE_URL de Supabase en un archivo .env si no usas el postgres local
      DATABASE_URL: ${DATABASE_URL:-postgres://hspeed:hspeed@db:5432/hspeed}
      JWT_SECRET: ${JWT_SECRET:-habbospeed_secret_key_2026}
    depends_on:
      db:
        condition: service_healthy
    # Migra/seedea y luego arranca el server
    command: ["sh", "-c", "node docker/migrate-and-seed.cjs && node dist/index.cjs"]

volumes:
  pgdata:
